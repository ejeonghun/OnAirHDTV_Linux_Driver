PACKAGE_NAME="onairgt"
PACKAGE_VERSION="0.3"
# kheaders.sh fetches the kernel-private headers for ${kernelver} from
# kernel.org and keeps them in /var/cache/onairgt, so a rebuild for a kernel
# whose headers were fetched before works offline
MAKE[0]="make KVER=${kernelver} KDIR=${kernel_source_dir} KHEADERS_CACHE=/var/cache/onairgt/kheaders modules"
CLEAN="make KVER=${kernelver} KDIR=${kernel_source_dir} clean"
BUILT_MODULE_NAME[0]="dvb-usb-onairgt"
DEST_MODULE_LOCATION[0]="/updates/dkms"
AUTOINSTALL="yes"
